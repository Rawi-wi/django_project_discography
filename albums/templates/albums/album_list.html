{% extends "base.html" %}

{% block title %}Albums{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Albums</h1>
        <a href="{% url 'albums:create' %}" class="btn btn-danger">Add album</a>
    </div>

    <div class="mb-3 text-secondary">
        Sort by:
        <a href="?sort=newest"
           class="{% if current_sort == 'newest' or not current_sort %}fw-bold text-danger{% else %}link-light{% endif %}">Newest</a>
        |
        <a href="?sort=oldest"
           class="{% if current_sort == 'oldest' %}fw-bold text-danger{% else %}link-light{% endif %}">Oldest</a> |
        <a href="?sort=title"
           class="{% if current_sort == 'title' %}fw-bold text-danger{% else %}link-light{% endif %}">Title</a>
    </div>

    <div class="row g-4">
        {% for album in albums %}
            <div class="col-12 col-md-6 col-lg-4">
                {% include "partials/_album_card.html" %}
            </div>
        {% empty %}
            <p class="text-secondary">No albums yet. Add the first one!</p>
        {% endfor %}
    </div>
{% endblock %}
