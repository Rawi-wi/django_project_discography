{% extends "base.html" %}

{% block title %}Albums{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Albums</h1>
    <a href="#" class="btn btn-danger">Add album</a>
  </div>

  <div class="row g-4">
    {% for album in albums %}
      <div class="col-12 col-md-6 col-lg-4">
        {% include "partials/_album_card.html" %}
      </div>
    {% empty %}
      <p class="text-secondary">No albums yet. Add the first one!</p>
    {% endfor %}
  </div>
{% endblock %}
